name: Publicar recetario y catálogo de la app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/catalogo-app-requirements.txt
      - name: Generar catálogo del mismo commit que las páginas
        run: >-
          python tools/exportar_catalogo_app.py --source . --commit "$GITHUB_SHA"
          --output datos/catalogo-app.json --report /tmp/catalogo-app-informe.json --allow-removed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar páginas y catálogo juntos
        id: deployment
        uses: actions/deploy-pages@v4
